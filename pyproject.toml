[project]
name = "invoice-parser"
version = "0.1.0"
description = "Extract treatment sheets and invoice services from Nine Lives PDFs."
requires-python = ">=3.12"
dependencies = ["pdfplumber>=0.11,<1"]

[project.scripts]
invoice-pipeline = "invoice_pipeline:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src_v2"]
sources = ["src_v2"]

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
pythonpath = ["src_v2"]
testpaths = ["tests_v2"]

[tool.uv]
cache-dir = ".uv-cache"

[tool.ruff]
cache-dir = ".ruff_cache"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C90", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.mccabe]
max-complexity = 5
