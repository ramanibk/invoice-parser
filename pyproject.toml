[project]
name = "invoice-parser"
version = "0.1.0"
description = "Extract treatment sheets and invoice services from Nine Lives PDFs."
requires-python = ">=3.12"
dependencies = ["pdfplumber>=0.11,<1"]

[project.scripts]
invoice-extract = "treatment_sheet_parser.nlf.cli:main"
needs-invoice = "treatment_sheet_parser.needs_invoice.cli:main"
generate-cat-mapping-prompt = "treatment_sheet_parser.cat_mapping.prompt:main"
prepare = "treatment_sheet_parser.prepare:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treatment_sheet_parser"]

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
testpaths = ["tests"]

[tool.uv]
cache-dir = ".uv-cache"

[tool.ruff]
cache-dir = ".ruff_cache"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C90", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.mccabe]
max-complexity = 5
